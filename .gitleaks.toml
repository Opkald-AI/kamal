# Gitleaks config (KLI-1484, ISO 27001 A.8.12 / IC-07).
# It uses all default Gitleaks rules. Allowlist only proven false positives,
# by path or by rule plus path. Never allowlist a secret value.
title = "Opkald-AI gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Upstream Kamal test fixtures (fake secrets and a test certificate)"
paths = [
  '''^test/configuration/proxy_test\.rb$''',
  '''^test/integration/main_test\.rb$''',
  '''^test/secrets/one_password_adapter_test\.rb$''',
  '''^test/integration/docker/deployer/app_with_custom_certificate/certs/key\.pem$''',
]
